name: links

# Weekly link check. Government and agency sites are often slow or briefly down, so broken links
# open (or update) a tracking issue instead of failing pull requests.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml README.md contributing.md
          output: lychee-report.md
          fail: false
      - name: Open or update tracking issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Broken links found by weekly check"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file lychee-report.md
          else
            gh issue create --title "$title" --label "link-rot" --body-file lychee-report.md \
              || gh issue create --title "$title" --body-file lychee-report.md
          fi
