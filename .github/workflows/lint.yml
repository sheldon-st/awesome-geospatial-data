name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # awesome-lint checks repository age from git history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test
      - name: README is generated from data
        run: pnpm check
      - name: awesome-lint
        run: pnpm lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
